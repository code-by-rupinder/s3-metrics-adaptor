logging:
  default: info
  components:
    eventparser: info
    metricsexporter: info
    sqspoller: debug
  format:
    timestampFormat: "2006-01-02T15:04:05.000Z07:00"
    prettyPrint: false

sqs:
  queues:
    - https://sqs-queue-url/acount/name
  buckets:
    - name: s3event-test-s3
      prefix: 
        - "logs/test"
        - "prod"
        - "logs/prod"
        - "finance"
        - "hr"
        - "it"
        - "marketing"
        - "operations"
        - "legal"
        - "sales"
        - "research"
        - "extension_test"
        - "quick_test"
        - "load_test"
        - "bulk_test"
        - "anomaly_test"
    - name: s3event-test-ohio-s3
      prefix: 
        - "logs/prod"
  processUnlistedBuckets: true
  workerCount: 5    # Optional, defaults to 5
  maxMessages: 10   # Optional, defaults to 10
  waitTime: 20      # Optional, defaults to 20

metrics:
  enabled: true
  types:
    eventTotal: true
    objectSize: true
    userTotal: false
    ipTotal: true
    prefixTotal: true
    latency: true
    anomalyDetection: false
    lifecycleExpiration: true
    deleteTotal: true
    timestampMetrics: true      # Enable Unix timestamp metrics for events
  objectSizeBuckets:
    - 1024
    - 102400
    - 1048576
  port: 8087
  # Path labeling configuration for advanced S3 object path analysis
  # Path labeling configuration - TODO: Implement in next release
  # This feature will allow extracting structured labels from S3 object paths
# Cardinality monitoring configuration
cardinalityMonitoring:
  enabled: true
  logInterval: 300
  alertThreshold: 1000
  criticalThreshold: 5000
  maxCardinality: 10000

# Delete event filtering configuration
deleteEventFiltering:
  enabled: true
  includeActualDeletes: true    # Include actual file deletions
  includeVersionDeletes: false  # Exclude version deletions (recommended)
  includeDeleteMarkers: false   # Exclude delete markers (recommended)