logging:
  default: info
  components:
    eventparser: info
    metricsexporter: info
    sqspoller: debug
  format:
    timestampFormat: "2006-01-02T15:04:05.000Z07:00"
    prettyPrint: false

sqs:
  queues:
    - https://sqs-queue-url/acount/name
  buckets:
    - name: s3-bucket
      prefix: 
        - folder-1
        - folder-2
    - name: s3-bucket-2
      prefix: []
  processUnlistedBuckets: true
  workerCount: 5    # Optional, defaults to 5
  maxMessages: 10   # Optional, defaults to 10
  waitTime: 20      # Optional, defaults to 20

metrics:
  enabled: true
  types:
    eventTotal: true
    objectSize: true
    userTotal: false
    ipTotal: true
    prefixTotal: true
    latency: true
    anomalyDetection: false
    lifecycleExpiration: true
    deleteTotal: true
  objectSizeBuckets:
    - 1024
    - 102400
    - 1048576
  port: 8087