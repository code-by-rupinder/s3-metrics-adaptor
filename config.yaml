logging:
  default: info
  components:
    eventparser: info
    metricsexporter: info
    sqspoller: info
  format:
    timestampFormat: "2006-01-02T15:04:05.000Z07:00"
    prettyPrint: false

sqs:
  queues:
    - https://sqs.us-east-1.amazonaws.com/305018987196/s3event-test-sqs

  buckets:
    - name: s3event-test-s3
      prefix:
        - "logs/test"
        - "prod"
        - "logs/prod"
        - "finance"
        - "hr"
        - "it"
        - "marketing"
        - "operations"
        - "legal"
        - "sales"
        - "finance/2025/q1/reports"
        - "research"
        - "extension_test"
        - "bulk_test"
        - "anomaly_test"
    - name: s3event-test-ohio-s3
      prefix:
        - "logs/prod"
  processUnlistedBuckets:  true
  workerCount: 5    # Optional, defaults to 5
  maxMessages: 10   # Optional, defaults to 10
  waitTime: 2      # Optional, defaults to 20
  useEventTransformer: false  # Whether EventBridge transformer is enabled
  # Performance optimizations (automatically enabled):
  # - Batch processing: Processes up to 10 messages in parallel
  # - Message filtering: Pre-filters messages before expensive parsing
  # - Circuit breaker: Prevents processing during high failure rates (5 failures, 30s timeout)
  # - Path label caching: Caches path extraction results (1000 entries, 5min TTL)
  # - Performance metrics: Tracks messages/sec, parse time, batch size

metrics:
  enabled: true
  types:
    eventTotal: true
    objectSize: true
    ipTotal: true
    prefixTotal: true     # Enable this to track object metrics
    prefixDepthTotal: true
    fileExtensionTotal: true    # Enable tracking of total files by extension
    latency: true
    anomalyDetection: true
    lifecycleExpiration: true
    deleteTotal: true
    timestampMetrics: true      # Enable Unix timestamp metrics for events
  prefixDepth: 1  # Configures how many path segments to include in hierarchical path tracking
  objectSizeBuckets:
    - 1024.0
    - 102400.0
    - 1048576.0
  port: 8087
  # Performance metrics (automatically enabled):
  # - s3_poller_messages_per_second{queue}: Messages processed per second
  # - s3_poller_parse_time_seconds{queue,status}: Parse time histogram
  # - s3_poller_batch_size{queue}: Batch size distribution
  # - s3_metrics_cardinality_total{metric_name,status}: Cardinality monitoring
  # 
  # Health endpoint: GET /health returns JSON with cardinality monitoring status
  # - status: "healthy", "warning", or "critical"
  # - timestamp: Current timestamp
  # - cardinality_monitoring: Detailed cardinality statistics and alerts
  # Path labeling configuration - TODO: Implement in next release
  # This feature will allow extracting structured labels from S3 object paths
  # Example: finance/2025/q1/reports -> department="finance", year="2025", quarter="q1"
  # Cardinality monitoring configuration
  cardinalityMonitoring:
    # Enable cardinality monitoring to prevent metric explosion
    enabled: true
    # Interval in seconds for cardinality logging (default: 300 = 5 minutes)
    logInterval: 300
    # Alert when cardinality exceeds this value (default: 1000)
    alertThreshold: 1000
    # Critical alert threshold (default: 5000)
    criticalThreshold: 5000
    # Maximum allowed cardinality per metric (default: 10000)
    maxCardinality: 10000
  # Delete event filtering configuration
  deleteEventFiltering:
    # Enable delete event filtering to control what deletions are counted
    enabled: true
    # Include actual file deletions (recommended: true)
    includeActualDeletes: true
    # Include version deletions (recommended: false to avoid inflated metrics)
    includeVersionDeletes: false
    # Include delete markers (recommended: false to avoid inflated metrics)
    includeDeleteMarkers: false
 