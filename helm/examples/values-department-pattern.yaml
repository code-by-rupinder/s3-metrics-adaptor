# Example values for Department/Year/Quarter organizational pattern
# This pattern extracts department, year, and quarter from S3 object paths
# Example paths: finance/2025/q1/reports/file.pdf, hr/2025/q2/payroll/data.xlsx

replicaCount: 1

image:
  repository: codebyrupinder/s3-metrics-prom-adaptor
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

serviceAccount:
  create: true
  annotations:
    # For AWS EKS with IAM roles for service accounts (IRSA)
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT:role/S3EventExporterRole"

config:
  sqs:
    queues:
      - "https://sqs.us-west-2.amazonaws.com/123456789012/s3-events"
    workerCount: 5
    maxMessages: 10
    waitTime: 20

  metrics:
    enabled: true
    types:
      eventTotal: true
      objectSize: true
      ipTotal: true
      prefixTotal: true
      prefixDepthTotal: true
      fileExtensionTotal: true
      latency: true
      anomalyDetection: true
      lifecycleExpiration: true
      deleteTotal: true
      timestampMetrics: true
    prefixDepth: 4
    objectSizeBuckets:
      - 1024
      - 102400
      - 1048576
      - 10485760
      - 104857600
    # Path labeling for department/year/quarter pattern
    # Path labeling configuration - TODO: Implement in next release
    port: 8087

  logging:
    default: "info"
    components:
      metrics: "info"
      sqs: "info"
      parser: "info"
    format:
      timestampFormat: "2006-01-02T15:04:05Z07:00"
      prettyPrint: false

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

service:
  type: ClusterIP
  port: 8087

serviceMonitor:
  enabled: true
  interval: 30s
  labels:
    prometheus: kube-prometheus
