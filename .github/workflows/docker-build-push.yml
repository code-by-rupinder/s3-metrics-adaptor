name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "helm/**"
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "helm/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Custom tag for the image"
        required: false
        default: "latest"
        type: string

permissions:
  contents: read
  security-events: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: codebyrupinder/s3-metrics-prom-adaptor

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"

      - name: Run tests
        run: |
          echo "🧪 Running tests..."
          go mod tidy
          go test ./... -v
          echo "✅ All tests passed"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # set latest tag for main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # set version tag for releases (with v prefix)
            type=ref,event=tag
            # set version tag for releases (without v prefix)
            type=match,pattern=v(\d+\.\d+\.\d+),group=1,event=tag
            # set branch name for other branches
            type=ref,event=branch,enable={{is_default_branch}}
            # set PR number for pull requests
            type=ref,event=pr
            # custom tag from workflow dispatch
            type=raw,value={{inputs.tag}},enable=${{ github.event_name == 'workflow_dispatch' }}
            # commit SHA for unique identification
            type=sha,prefix={{branch}}-
          labels: |
            org.opencontainers.image.title=S3 Metrics Adapter
            org.opencontainers.image.description=Converts S3 events from SQS queues into Prometheus metrics
            org.opencontainers.image.vendor=codebyrupinder
            org.opencontainers.image.source=https://github.com/codebyrupinder/s3-metrics-adapter
            org.opencontainers.image.documentation=https://github.com/codebyrupinder/s3-metrics-adapter/blob/main/README.md
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image (amd64 only, verbose, 10m timeout)
        id: build
        uses: docker/build-push-action@v5
        timeout-minutes: 10
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name != 'main' && github.ref_name || 'dev' }}
            BUILD_TIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        if: github.event_name != 'pull_request'
        run: |
          echo "🧪 Testing Docker image..."

          # Test version command
          docker run --rm ${{ env.IMAGE_NAME }}:latest --version

          # Test help command  
          docker run --rm ${{ env.IMAGE_NAME }}:latest --help | head -5

          echo "✅ Docker image tests passed"

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request'

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: "sarif"
          output: "trivy-results.sarif"

    #   - name: Upload Trivy scan results to GitHub Security tab
    #     uses: github/codeql-action/upload-sarif@v3
    #     with:
    #       sarif_file: "trivy-results.sarif"

  create-release-summary:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: always() && github.event_name != 'pull_request'

    steps:
      - name: Create Release Summary
        run: |
          echo "## 🐳 Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.build-and-test.result }}" == "success" ]]; then
            echo "### ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Image Tags:**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${{ needs.build-and-test.outputs.image-tags }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Pull Commands:**" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "# Latest version" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "# Run the container" >> $GITHUB_STEP_SUMMARY
            echo "docker run --rm ${{ env.IMAGE_NAME }}:latest --version" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY
            echo "- [Docker Hub Repository](https://hub.docker.com/r/${{ env.IMAGE_NAME }})" >> $GITHUB_STEP_SUMMARY
            echo "- [Source Code](https://github.com/codebyrupinder/s3-metrics-adapter)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "Please check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.security-scan.result }}" == "success" ]]; then
            echo "- [Security Scan Results](https://github.com/${{ github.repository }}/security/code-scanning)" >> $GITHUB_STEP_SUMMARY
          fi

  notify-on-release:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'release'

    steps:
      - name: Notify Release
        run: |
          echo "🎉 New release published!"
          echo "Docker image: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          echo "Available on Docker Hub: https://hub.docker.com/r/${{ env.IMAGE_NAME }}"
